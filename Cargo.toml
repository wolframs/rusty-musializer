[workspace]
resolver = "2"
members = [
    "crates/raylib-link",
    "crates/musializer-core",
    "crates/musializer-runtime",
    "crates/musializer-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.92"

[workspace.dependencies]
# Build the pinned upstream C release ourselves to retain the audio diagnostic.
# The 6.0 Rust bindings' headers match this upstream release byte-for-byte.
raylib = { version = "=6.0.0", default-features = false, features = ["nobuild", "SUPPORT_IMAGE_GENERATION"] }
raylib-sys = { version = "=6.0.0", default-features = false, features = ["nobuild"] }
raylib-link = { path = "crates/raylib-link" }
egui = "0.35"
musializer-core = { path = "crates/musializer-core" }
musializer-runtime = { path = "crates/musializer-runtime" }

# Conservative, ordinary crates, per the plan's dependency starting point.
# `thiserror` for library errors, `anyhow` only at the binary/command boundary.
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
clap = { version = "4", features = ["derive"] }

# Optimize dev builds, because the evidence in this repository is *captures*,
# and every capture is a real application launch. `tools/headless_check.sh` makes
# roughly two hundred of them, and at opt-level 0 the per-frame scene arithmetic
# — analyzer bands, layout, and Phosphor Dream's 8,640 cells of trigonometry —
# dominates the run. Measured on this machine at 240 frames: 5.0 s wall for
# Spectrum and 8.1 s for Phosphor Dream, against a build that is otherwise idle.
#
# `debug_assertions` is on at every opt-level, so the debug-only checks the tests
# and the gate rely on are untouched. Dependencies go to 3 because they are built
# once and then cached; the workspace crates stay at 1, which is most of the
# speed for a small fraction of the compile time.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
# The C build deliberately avoids fast-math: project parsing, analysis, and
# event contracts reject NaN/Inf, and finite-only assumptions would compile
# those checks away. Rust does not enable fast-math, so nothing to disable —
# this note exists so nobody adds it later. (src_build/nob_linux.c:5-11)
lto = "thin"
