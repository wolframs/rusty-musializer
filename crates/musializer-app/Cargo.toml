[package]
name = "musializer-app"
description = "The Musializer binary: CLI, workspace UI, scene drawing, orchestration"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "musializer"
path = "src/main.rs"

# Writes the synthetic WAV the headless checks analyze. A fixture generator
# rather than a committed binary asset: the repository rule is synthetic
# fixtures only, and a generator is smaller and auditable.
[[bin]]
name = "make-fixture-wav"
path = "src/bin/make_fixture_wav.rs"

[dependencies]
musializer-core.workspace = true
musializer-runtime.workspace = true
raylib.workspace = true
raylib-sys.workspace = true
anyhow.workspace = true
# Project save/open reports failures whose wording reaches the notice tray, so
# each is a named variant rather than a formatted string.
thiserror.workspace = true
# For the CLI surface (Agent F). Note the C parser has no unknown-flag
# diagnostic and treats any unrecognized --flag as an audio path; clap errors
# instead, which is a deliberate divergence recorded in REWRITE_PLAN.md.
clap.workspace = true
