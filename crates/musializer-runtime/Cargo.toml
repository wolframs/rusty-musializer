[package]
name = "musializer-runtime"
description = "raylib, resources, processes and filesystem edges behind small safe APIs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
musializer-core.workspace = true
raylib.workspace = true
raylib-sys.workspace = true
# Supplies the actual raylib 5.5 library; raylib-sys is in nobuild mode and
# emits no link directives of its own.
raylib-5-5-link.workspace = true
thiserror.workspace = true

# No tempfile: it was added in anticipation of transactional staging and turned
# out to be the wrong tool. `rename(2)` cannot cross filesystems, so staging must
# write *next to* the destination rather than in a temp directory — that is a
# name-and-retry loop, not a temp-dir crate. See `process::publish`.
